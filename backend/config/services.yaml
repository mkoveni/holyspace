# config/services.yaml

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # ============================================================
    # Application
    # ============================================================

    App\IdentityAccess\Application\:
        resource: "../src/IdentityAccess/Application/"

    App\People\Application\:
        resource: "../src/People/Application/"

    App\LifeEvents\Application\:
        resource: "../src/LifeEvents/Application/"

    # ============================================================
    # Infrastructure
    # ============================================================

    App\IdentityAccess\Infrastructure\:
        resource: "../src/IdentityAccess/Infrastructure/"
        exclude:
            - ../src/IdentityAccess/Infrastructure/Security/SymfonyUser.php

    App\People\Infrastructure\:
        resource: "../src/People/Infrastructure/"

    App\LifeEvents\Infrastructure\:
        resource: "../src/LifeEvents/Infrastructure/"

    # ============================================================
    # Presentation
    # ============================================================

    App\IdentityAccess\Presentation\:
        resource: "../src/IdentityAccess/Presentation/"

    App\People\Presentation\:
        resource: "../src/People/Presentation/"

    App\LifeEvents\Presentation\:
        resource: "../src/LifeEvents/Presentation/"

    # ============================================================
    # IdentityAccess repositories
    # ============================================================

    App\IdentityAccess\Domain\Repository\UserAccountRepository:
        alias: App\IdentityAccess\Infrastructure\Persistence\DBAL\DbalUserAccountRepository

    App\IdentityAccess\Domain\Repository\RoleRepository:
        alias: App\IdentityAccess\Infrastructure\Persistence\DBAL\DbalRoleRepository

    App\IdentityAccess\Domain\Repository\PermissionRepository:
        alias: App\IdentityAccess\Infrastructure\Persistence\DBAL\DbalPermissionRepository

    # ============================================================
    # People repositories
    # ============================================================

    App\People\Domain\Repository\PersonRepository:
        alias: App\People\Infrastructure\Persistence\DBAL\DbalPersonRepository

    App\People\Domain\Repository\FamilyRepository:
        alias: App\People\Infrastructure\Persistence\DBAL\DbalFamilyRepository

    App\People\Domain\Repository\RelationshipRepository:
        alias: App\People\Infrastructure\Persistence\DBAL\DbalRelationshipRepository
    App\People\Domain\Repository\PersonProfileRepository:
        alias: App\People\Infrastructure\Persistence\DBAL\DbalPersonProfileRepository
    App\People\Domain\Repository\PersonReadRepository:
        alias: App\People\Infrastructure\ReadModel\DBAL\DbalPersonReadRepository
    App\People\Domain\Repository\CommunicationOptionRepository:
        alias: App\People\Infrastructure\Persistence\DBAL\DbalCommunicationOptionRepository

    # ============================================================
    # LifeEvents repositories
    # ============================================================

    App\LifeEvents\Domain\Repository\LifeEventRepository:
        alias: App\LifeEvents\Infrastructure\Persistence\DBAL\DbalLifeEventRepository

    # ===========================================================
    # Domain
    # ===========================================================

    App\IdentityAccess\Domain\Service\PasswordHasher:
        alias: App\IdentityAccess\Infrastructure\Security\SymfonyPasswordHasher

    # Events context services and attributed repository alias.
    App\Events\Application\:
        resource: "../src/Events/Application/"
    App\Events\Infrastructure\:
        resource: "../src/Events/Infrastructure/"
    App\Events\Presentation\:
        resource: "../src/Events/Presentation/"

    App\Shared\Application\:
        resource: "../src/Shared/Application/"

    App\Shared\Infrastructure\:
        resource: "../src/Shared/Infrastructure/"
        exclude:
            - ../src/Shared/Infrastructure/Persistence/WorkflowDocumentMapper.php
            - ../src/Shared/Infrastructure/Persistence/WorkflowDocumentRepository.php

    App\Volunteering\Application\:
        resource: "../src/Volunteering/Application/"

    App\Volunteering\Infrastructure\:
        resource: "../src/Volunteering/Infrastructure/"

    App\Volunteering\Presentation\:
        resource: "../src/Volunteering/Presentation/"

    App\ChildrenMinistry\Application\:
        resource: "../src/ChildrenMinistry/Application/"

    App\ChildrenMinistry\Infrastructure\:
        resource: "../src/ChildrenMinistry/Infrastructure/"

    App\ChildrenMinistry\Presentation\:
        resource: "../src/ChildrenMinistry/Presentation/"

    App\Giving\Application\:
        resource: "../src/Giving/Application/"

    App\Giving\Infrastructure\:
        resource: "../src/Giving/Infrastructure/"

    App\Giving\Presentation\:
        resource: "../src/Giving/Presentation/"

    App\Attendance\Application\:
        resource: "../src/Attendance/Application/"

    App\Attendance\Infrastructure\:
        resource: "../src/Attendance/Infrastructure/"

    App\Attendance\Presentation\:
        resource: "../src/Attendance/Presentation/"

    App\Ministries\Application\:
        resource: "../src/Ministries/Application/"

    App\Ministries\Infrastructure\:
        resource: "../src/Ministries/Infrastructure/"

    App\Ministries\Presentation\:
        resource: "../src/Ministries/Presentation/"

    App\Communications\Application\:
        resource: "../src/Communications/Application/"

    App\Communications\Infrastructure\:
        resource: "../src/Communications/Infrastructure/"

    App\Communications\Presentation\:
        resource: "../src/Communications/Presentation/"

    App\Shared\Presentation\Http\WorkflowAuditController: ~

    App\Forms\Application\:
        resource: "../src/Forms/Application/"

    App\Forms\Infrastructure\:
        resource: "../src/Forms/Infrastructure/"

    App\Forms\Presentation\:
        resource: "../src/Forms/Presentation/"

    App\ServicePlanning\Application\:
        resource: "../src/ServicePlanning/Application/"

    App\ServicePlanning\Infrastructure\:
        resource: "../src/ServicePlanning/Infrastructure/"

    App\ServicePlanning\Presentation\:
        resource: "../src/ServicePlanning/Presentation/"

    App\MemberPortal\:
        resource: "../src/MemberPortal/"

    App\Reporting\:
        resource: "../src/Reporting/"

    App\Payments\:
        resource: "../src/Payments/"
        exclude: ../src/Payments/Domain/

    App\Media\:
        resource: "../src/Media/"
        exclude: ../src/Media/Domain/

    # Compose optional delivery policies at the adapter boundary.
    App\Communications\Application\Command\QueueCampaign\QueueCampaignHandler:
        arguments:
            $guards: !tagged_iterator onechurch.delivery_guard
    App\Communications\Application\Command\DeliverNextMessage\DeliverNextMessageHandler:
        arguments:
            $guards: !tagged_iterator onechurch.delivery_guard
