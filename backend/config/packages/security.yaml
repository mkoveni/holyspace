security:
    password_hashers:
        App\IdentityAccess\Infrastructure\Security\SymfonyUser: auto

    providers:
        app_user_provider:
            id: App\IdentityAccess\Infrastructure\Security\UserProvider

    firewalls:
        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_user_provider
            user_checker: App\IdentityAccess\Infrastructure\Security\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\IdentityAccess\Infrastructure\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\IdentityAccess\Infrastructure\Security\UserData:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 5
