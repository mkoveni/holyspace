  '/api/workflows/{context}/{id}/audit':
    get:
      summary: 'Read permission-protected operational change history'
      security:
        -
          bearerAuth: {}
      parameters:
        -
          name: context
          in: path
          required: true
          schema:
            type: string
            enum:
              - volunteering
              - children
              - giving
              - attendance
              - ministries
              - communications
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        -
          name: before
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Change history, newest version first'
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - nextBefore
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowAuditEntry'
                  nextBefore:
                    type: integer
                    nullable: true
        403:
          description: 'Context manage permission required'
        404:
          description: 'Record not found'
        422:
          description: 'Invalid pagination'
  '/api/communications/deliveries/{id}/resolve':
    put:
      summary: 'Reconcile a failed or uncertain delivery without resending'
      description: 'Requires communications.manage. Sending attempts must be at least five minutes old. Confirm the outcome with the provider first.'
      security:
        -
          bearerAuth: {}
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: If-Match
          in: header
          required: false
          description: 'Quoted record version loaded by the client. Stale versions return 409.'
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - note
              properties:
                status:
                  type: string
                  enum:
                    - delivered
                    - failed
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        200:
          description: 'Resolved delivery and retained reconciliation evidence'
        403:
          description: 'Permission required'
        409:
          description: 'Stale version or delivery not ready for reconciliation'
        422:
          description: 'Invalid outcome or missing evidence'

  /api/payments/member:
    get:
      summary: Own hosted payments, enabled funds and paid event offers
      description: Requires member.portal, linked identity and verified MFA. No donor IDs are accepted. Sandbox charges never post real gifts or confirm tickets.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Providers, funds, events, orders, verified charges and refunds; private no-store"}
        '403': {description: "Missing member access, linked person or verified MFA"}
  /api/payments/checkout:
    post:
      summary: Create or resume a hosted ZAR payment
      description: Owner is derived from the verified member account. Ticket amounts come from occurrence settings; ticket places are held for 15 minutes. Monthly recurring giving is Payfast only. Repeat the same requestKey after an ambiguous response.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, purpose, targetId, requestKey]
              properties:
                provider: {type: string, enum: [payfast, yoco]}
                purpose: {type: string, enum: [giving, ticket]}
                targetId: {type: string, format: uuid, description: "Enabled fund ID or paid occurrence ID"}
                requestKey: {type: string, minLength: 1, maxLength: 100}
                amountMinor: {type: integer, nullable: true, minimum: 500, maximum: 100000000, description: "Required for giving; ticket price is server-owned"}
                recurring: {type: boolean, default: false}
                currency: {type: string, enum: [ZAR], default: ZAR}
      responses:
        '201': {description: "Order and checkout URL/method/form fields, or its already completed status"}
        '403': {description: "Member identity or MFA is required"}
        '409': {description: "Conflicting request, unavailable provider, unresolved subscription or no ticket places"}
        '422': {description: "Invalid amount, currency or recurring provider"}
        '503': {description: "Checkout creation is unconfirmed; retry the same request key"}
  /api/payments/member/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read an owned payment without accepting return-page status as proof
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Owned payment, verified charges and refund matching status"}
        '403': {description: "Missing member/MFA access"}
        '404': {description: "Payment missing or belongs to another person"}
  /api/payments/member/{id}/cancel-subscription:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Cancel an owned verified Payfast monthly giving subscription
      description: Cancellation remains cancel_requested on an unconfirmed provider response. Previous gifts and verified in-flight charges remain recorded.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
      responses:
        '200': {description: "Provider-confirmed cancelled subscription"}
        '404': {description: "Not an owned subscription"}
        '409': {description: "Stale version or no verified subscription token"}
        '503': {description: "Provider cancellation unconfirmed; review status before retrying"}
  /api/payments:
    get:
      summary: Staff payment and reconciliation workspace
      description: Requires payments.manage. Fund configuration also needs giving.manage; donor names are shown only with people.read. No provider secrets or subscription tokens are returned.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Provider readiness, settings and payments requiring review"}
        '403': {description: "Missing payments.manage"}
  /api/payments/funds:
    put:
      summary: Enable active funds for member online giving
      description: Requires payments.manage and giving.manage. Default is no enabled funds.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [fundIds, expectedVersion], properties: {fundIds: {type: array, maxItems: 100, items: {type: string, format: uuid}}, expectedVersion: {type: integer, minimum: 0}}}
      responses:
        '200': {description: "Updated enabled funds and version"}
        '403': {description: "Missing financial configuration permission"}
        '409': {description: "Stale settings version"}
        '422': {description: "Invalid or inactive fund"}
  /api/payments/{id}/reconcile:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record staff evidence and retry posting verified gifts
      description: Requires payments.manage. Cannot invent payment success, confirm a late ticket or initiate a refund. Unmatched refunds and paid tickets without a confirmed place and completed refund block review closure.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion, note], properties: {expectedVersion: {type: integer, minimum: 1}, note: {type: string, minLength: 1, maxLength: 1000}}}
      responses:
        '200': {description: "Reconciled order with recorded evidence"}
        '409': {description: "Stale version or unresolved posting/refund/booking discrepancy"}
  /api/payments/{id}/subscription-status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Retrieve Payfast subscription state for staff review
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
      responses:
        '200': {description: "Verified provider state; unconfirmed cancellation stays pending"}
        '403': {description: "Missing payments.manage"}
        '409': {description: "Stale version or no verified subscription"}
        '503': {description: "Provider status unavailable or unrecognised"}
  /api/payments/charges/{id}/refund:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record a completed provider-dashboard refund or match an existing refund
      description: Requires payments.manage and explicit confirmation. Does not initiate money movement. Use the exact provider refund ID; do not include the display prefix. References are deduplicated.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion, amountMinor, reference, confirmed], properties: {expectedVersion: {type: integer, minimum: 1}, amountMinor: {type: integer, minimum: 1, maximum: 100000000}, reference: {type: string, minLength: 1, maxLength: 150}, confirmed: {type: boolean, enum: [true]}}}
      responses:
        '200': {description: "Refund recorded; inspect payment review and matching status"}
        '403': {description: "Missing payments.manage"}
        '409': {description: "Stale charge version"}
        '422': {description: "Invalid refund or missing completion confirmation"}
  /api/payments/webhooks/{provider}:
    parameters:
      - {name: provider, in: path, required: true, schema: {type: string, enum: [payfast, yoco]}}
    post:
      summary: Verify provider notification and transactionally deduplicate posting
      description: Public provider endpoint, not JWT-authenticated. Payfast requires IP, merchant, ITN signature and server validation. Yoco requires signed raw body, webhook ID and timestamp within three minutes. Order amount, currency, checkout identity and environment must match. Return URLs cannot call this endpoint to mark an order paid.
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, description: "Yoco signed raw event"}}
          application/x-www-form-urlencoded: {schema: {type: object, description: "Payfast signed ordered ITN fields"}}
      responses:
        '200': {description: "Notification processed, retained for staff review or unrelated merchant transaction ignored"}
        '400': {description: "Invalid signature, replay timestamp, origin or provider notification"}
        '413': {description: "Payload exceeds 64 KiB"}
        '503': {description: "Verification/checkout confirmation unavailable; provider should retry"}
  /api/events/{eventId}/occurrences/{occurrenceId}/registrations/ticket-price:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: occurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Configure server-owned paid ticket price or restore free registration
      description: Requires events.manage. Price cannot change while a payment reservation is active. Capacity includes confirmed people and pending_payment reservations.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 0}, amountMinor: {type: integer, nullable: true, minimum: 500, maximum: 100000000}}}
      responses:
        '200': {description: "Updated registration settings and ticket price"}
        '403': {description: "Missing events.manage"}
        '409': {description: "Stale version or active payment reservations"}
        '422': {description: "Invalid ticket price"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ReportingFilters:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [prospect, active, inactive, transferred, deceased]}
        ageGroup: {type: string, enum: [adult, child]}
        ministryId: {type: string, format: uuid}
        attendanceStatus: {type: string, enum: [present, absent, no_recorded_presence]}
        lookbackDays: {type: integer, minimum: 1, maximum: 366}
        from: {type: string, format: date}
        to: {type: string, format: date}
      description: AND filters. Attendance requires a rolling lookback OR fixed dates through today. No recorded presence is not inferred absence. Unknown/future birthdays do not match age filters.
    ReportingSegmentPayload:
      type: object
      required: [name, filters]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        filters: {$ref: '#/components/schemas/ReportingFilters'}
        expectedVersion: {type: integer, minimum: 1, nullable: true, description: Required for updates}
    ReportingTaskPayload:
      type: object
      required: [personId, assigneeId, title, dueOn]
      properties:
        personId: {type: string, format: uuid}
        assigneeId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        dueOn: {type: string, format: date}
        segmentId: {type: string, format: uuid, nullable: true}
    ReportingRulePayload:
      type: object
      required: [name, segmentId, segmentVersion, assigneeId, taskTitle]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        segmentId: {type: string, format: uuid}
        segmentVersion: {type: integer, minimum: 1}
        assigneeId: {type: string, format: uuid}
        taskTitle: {type: string, minLength: 1, maxLength: 200}
        dueInDays: {type: integer, minimum: 0, maximum: 90, default: 7}
        active: {type: boolean, default: false}
        expectedVersion: {type: integer, minimum: 1, nullable: true, description: Required for updates}
    ServicePlanInput:
      type: object
      required: [occurrenceId, title, items]
      properties:
        occurrenceId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [title, durationMinutes]
            properties:
              title: {type: string, minLength: 1, maxLength: 200}
              durationMinutes: {type: integer, minimum: 1, maximum: 180}
              notes: {type: string, maxLength: 2000}
              resourceUrl: {type: string, maxLength: 2000, description: Optional HTTPS resource without URL credentials; never fetched by the server}
    FormField:
      type: object
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}
        label: {type: string, minLength: 1, maxLength: 200}
        type: {type: string, enum: [text, textarea, email, select, checkbox]}
        required: {type: boolean}
        options: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 100}}
    FormDefinitionInput:
      type: object
      required: [title, fields]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000, default: ''}
        fields: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/FormField'}}
        eventId: {type: string, format: uuid, nullable: true}
        occurrenceId: {type: string, format: uuid, nullable: true}
    FamilyOverview:
      type: object
      required: [id, name, members, addresses, primaryContact, upcomingEvents, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/FamilyMember' }
        primaryContact:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/FamilyMember' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/FamilyAddress' }
        upcomingEvents:
          description: Scheduled active events and the next annual occurrence of past birth, marriage, and engagement events, sorted by occurrence date. Cancelled events are excluded; February 29 recurrences use February 28 in non-leap years.
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              eventDate: { type: string, format: date }
              status: { type: string, enum: [active, completed] }
              isAnniversary: { type: boolean }
              originalEventDate: { type: string, format: date, nullable: true }
              notes: { type: string, nullable: true }
              memberIds: { type: array, items: { type: string } }

    FamilyMember:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, nullable: true }
        gender: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [head, spouse, child, parent, other] }
        membershipCreatedAt: { type: string }

    FamilyAddress:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [residential, postal, work, other] }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        province: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        country: { type: string }

    Person:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        dateOfBirth:
          type: string
          format: date
          example: "1980-01-01"
        gender:
          type: string
          enum: [male, female, unspecified]
          example: unspecified
        email:
          type: string
          example: john.doe@example.com
        phone:
          type: string
          example: "+1234567890"
        status:
          type: string
          example: active
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"

    Family:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Doe Family"
        primaryContactPersonId: { type: string, nullable: true }
        members:
          type: array
          items: { $ref: '#/components/schemas/FamilyMember' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/FamilyDetailAddress' }
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"

    Relationship:
      type: object
      properties:
        id: { type: string }
        personId: { type: string }
        relatedPersonId: { type: string }
        relatedFirstName: { type: string }
        relatedLastName: { type: string }
        type: { type: string }
        endedAt: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }

    UserAccount:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
