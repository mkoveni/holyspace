openapi: 3.0.3
info:
  title: Church Management Portal API
  version: 1.0.0
  description: >-
    REST API for the Church Management Portal application. People (including
    relationships and autocomplete), Families, Events, and Life Events require
    people.read, families.read, events.read, and life_events.read respectively
    for GET/HEAD. Writes require the corresponding .manage permission, which
    also grants read access. Authenticated callers without permission receive
    403. Account administration requires identity.manage; operational contexts
    retain their corresponding .manage permissions.
  contact:
    name: API Support
    email: support@churchportal.local

servers:
  - url: https://api.churchportal.local/v1
    description: Production server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /api/audit/{context}/{id}:
    get:
      summary: Read immutable field-level change history, including deleted records
      description: >-
        Requires the context management permission. Identity and media require identity.manage;
        reporting requires reports.manage. PostgreSQL history includes JSON Pointer field paths,
        presence flags, typed before/after values, transaction/request IDs and redacted secret fields.
        Legacy metadata-only history remains available at /api/workflows/{context}/{id}/audit.
      security: [{bearerAuth: []}]
      parameters:
        - name: context
          in: path
          required: true
          schema: {type: string, enum: [identity, people, families, life_events, events, attendance, children, ministries, volunteering, service_planning, giving, payments, communications, reporting, forms, media]}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: before
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Entries ordered by descending audit ID, with nextBefore for the next page
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, format: int64}
                        recordId: {type: string}
                        action: {type: string, enum: [created, updated, deleted]}
                        actorId: {type: string, nullable: true}
                        requestId: {type: string, nullable: true}
                        transactionId: {type: string}
                        source: {type: string}
                        occurredAt: {type: string, format: date-time}
                        versionBefore: {type: integer, nullable: true}
                        version: {type: integer, nullable: true}
                        changes:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              fromPresent: {type: boolean}
                              toPresent: {type: boolean}
                              from: {nullable: true}
                              to: {nullable: true}
                  nextBefore: {type: integer, format: int64, nullable: true}
        '403': {description: Context management access required}
        '422': {description: Invalid identifier or pagination}
        '501': {description: Field history requires the PostgreSQL migrations; use the legacy workflow journal}
  /api/media/{target}/{ownerId}:
    parameters:
      - {name: target, in: path, required: true, schema: {type: string, enum: [person, family, event, form]}}
      - {name: ownerId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get current image metadata and replacement version
      description: Requires the owner's read permission; management also grants reading. Content is never included in metadata.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Version and image metadata; image is null when absent'}
        '403': {description: 'Missing owner viewing permission'}
        '404': {description: 'Owner not found'}
    post:
      summary: Upload or replace the owner's image
      description: Requires corresponding manage permission. JPEG, PNG or WebP, at most 5 MiB and 16 million pixels. Re-encoded to PNG; largest side at most 1920px. Atomic versioned replacement.
      security: [{bearerAuth: []}]
      parameters:
        - {name: X-Image-Version, in: header, required: true, schema: {type: integer, minimum: 0}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        '200': {description: 'New image metadata and version'}
        '403': {description: 'Missing owner management permission'}
        '404': {description: 'Owner not found'}
        '409': {description: 'Stale image version'}
        '413': {description: 'Request exceeds transport limit'}
        '422': {description: 'Invalid image or version header'}
    delete:
      summary: Remove image bytes while retaining its replacement version
      security: [{bearerAuth: []}]
      parameters:
        - {name: X-Image-Version, in: header, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 'New version with null image'}
        '403': {description: 'Missing owner management permission'}
        '409': {description: 'Stale image version'}
  /api/media/{target}/{ownerId}/content:
    get:
      summary: Read private image bytes
      security: [{bearerAuth: []}]
      parameters:
        - {name: target, in: path, required: true, schema: {type: string, enum: [person, family, event, form]}}
        - {name: ownerId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 'PNG image with private no-store and nosniff headers'
          content:
            image/png:
              schema: {type: string, format: binary}
        '403': {description: 'Missing owner viewing permission'}
        '404': {description: 'Owner or image not found'}
  /api/public/forms/{token}/banner:
    get:
      summary: Read the current banner of a published public form
      security: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: 'Current sanitized PNG with no-store headers'
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: 'Form unpublished or token/banner unavailable'}

  /api/public/forms/{token}/event-banner:
    get:
      summary: Read the event banner linked to a currently published form
      description: Only the event linked to this form is accessible. Unpublishing the form revokes public image access. No anonymous event ID lookup is exposed.
      security: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: Sanitized event PNG with no-store and nosniff headers
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: Unpublished form, missing event link or unavailable image}

  /api/volunteer-rota:
    get:
      summary: Coordinator invitation and assignment overview
      description: Requires volunteering.manage. Settles expired/stale invitations; invited positions remain reserved but cannot provide children's staffing.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Roles, profiles, shifts, assignments, invitations and reminder references"}
        '403': {description: "Missing coordinator access"}
  /api/volunteer-rota/invitations:
    post:
      summary: Invite an eligible volunteer and reserve a position
      description: Requires volunteering.manage. Expiry must be future and no later than shift start. Existing availability, screening, qualification, capacity and overlap rules apply.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shiftId, personId, expiresAt]
              properties:
                shiftId: {type: string, format: uuid}
                personId: {type: string, format: uuid}
                expiresAt: {type: string, format: date-time}
      responses:
        '201': {description: "Pending versioned invitation with assignment/shift snapshots"}
        '409': {description: "Eligibility, overlap or capacity conflict"}
        '422': {description: "Invalid deadline or identifiers"}
  /api/volunteer-workspace:
    get:
      summary: View the linked volunteer's own serving schedule
      description: Requires volunteering.serve and an active account linked to a person. No other volunteers, profiles, contact or screening data are returned.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Own assignments and invitation histories; no-store"}
        '403': {description: "Missing serving permission or person link"}
  /api/volunteer-workspace/invitations/{id}/response:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Accept or decline the linked person's pending invitation
      description: Rechecks deadline, versions and authoritative eligibility. Acceptance commits staffing; decline frees capacity. Other people cannot respond for the recipient.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expectedVersion]
              properties:
                decision: {type: string, enum: [accepted, declined]}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        '200': {description: "Final invitation response"}
        '403': {description: "Outside personal serving scope"}
        '409': {description: "Expired, withdrawn, changed or ineligible invitation"}
  /api/volunteer-rota/assignments/{id}/reminder:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Prepare a volunteer reminder draft without sending
      description: Requires volunteering.manage and communications.manage. Reference makes preparation idempotent. Staff must review and queue the draft separately; consent and live staffing guards run at queueing and before delivery claim.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, reference]
              properties:
                channel: {type: string, enum: [email, sms]}
                reference: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201': {description: "Reminder reference and draft campaignId"}
        '403': {description: "Missing coordinator or communication permission"}
        '409': {description: "Closed or changed assignment or reference conflict"}
  /api/service-plans:
    get:
      summary: Staff service-plan catalogue
      description: Requires service_planning.read, which is implied by service_planning.manage. Volunteers use mine instead of this global catalogue.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Staff plan items collection"}
        '403': {description: "Missing global plan read access"}
    post:
      summary: Create an ordered draft service plan
      description: Requires service_planning.manage. One plan per occurrence; item durations must fit the scheduled gathering.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicePlanInput'}
      responses:
        '201': {description: "Versioned draft plan"}
        '409': {description: "Existing plan or cancelled occurrence"}
        '422': {description: "Invalid order or resource URL or duration"}
  /api/service-plans/mine:
    get:
      summary: Published plans related to the linked person's serving assignments
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Scoped published plan items"}
        '403': {description: "Missing personal serving access"}
  /api/service-plans/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: View a permitted service order and resource links
      description: Staff readers see draft/history. Linked volunteers see published plans only for their own invited/assigned/reviewing assignments; declined, expired or cancelled participation does not grant access.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Plan, occurrence and durationMinutes; no-store"}
        '403': {description: "Plan outside serving/read scope"}
        '404': {description: "Plan not found"}
    put:
      summary: Edit service order and return it to draft
      description: Requires service_planning.manage and expectedVersion. Occurrence cannot change; editing closes participant visibility until publication.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ServicePlanInput'}
                - {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
      responses:
        '200': {description: "Updated draft plan"}
        '403': {description: "Missing planning management"}
        '409': {description: "Stale version or changed occurrence"}
  /api/service-plans/{id}/publication:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Review and publish/unpublish the service order
      description: Requires service_planning.manage. Publication revalidates event status and duration. Event changes require explicit coordinator review and publication again.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, published]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                published: {type: boolean}
      responses:
        '200': {description: "Updated publication status and version"}
        '409': {description: "Stale version or cancelled occurrence"}
  /api/groups:
    get:
      summary: List authorised groups for the meeting workspace
      description: Managers with ministries.manage see all groups. ministries.lead requires an active account linked to a Person and active leader membership; only those active groups are returned.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Scoped items collection; may be empty"}
        '403': {description: "Missing group workspace permission"}
  /api/groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: View a scoped roster and linked group meetings
      description: Returns group, minimal member identities/membership dates, meetings, roster-scoped Attendance entries, presence-only child flags, counts and canManage. Unrelated event attendees and custody/contact details are excluded.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Scoped group workspace; no-store"}
        '403': {description: "Group outside current leadership scope"}
        '404': {description: "Group not found"}
  /api/groups/{id}/meetings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Link an Events occurrence to a group meeting
      description: Requires ministries.manage and an active group. Scheduled occurrences can belong to only one group meeting, including cancelled links.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrenceId]
              properties:
                occurrenceId: {type: string, format: uuid}
      responses:
        '201': {description: "Versioned group meeting"}
        '403': {description: "Missing management permission"}
        '409': {description: "Archived group or cancelled/already linked occurrence"}
  /api/groups/{groupId}/meetings/{id}/cancel:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Cancel group attendance without changing the Events occurrence
      description: Requires ministries.manage. Existing Attendance history is retained and remains correctable.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: "Cancelled meeting with new version"}
        '403': {description: "Missing management permission"}
        '409': {description: "Stale or already cancelled meeting"}
  /api/groups/{groupId}/meetings/{id}/attendance:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record or correct roster-scoped meeting attendance
      description: Requires current scoped leadership or ministries.manage. Membership joining dates are inclusive and leaving dates exclusive in the event timezone. Corrections require the existing Attendance version and a reason. New entries are blocked for cancelled/archived meetings. Child presence cannot be changed to absent/excused.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, status]
              properties:
                personId: {type: string, format: uuid}
                status: {type: string, enum: [present, absent, excused]}
                expectedVersion: {type: integer, minimum: 1, nullable: true}
                reason: {type: string, maxLength: 1000, nullable: true}
      responses:
        '200': {description: "Attendance-owned entry; creation/correction shares the workflow transaction and audit history"}
        '403': {description: "Group outside current leadership scope"}
        '404': {description: "Meeting does not belong to this group"}
        '409': {description: "Stale attendance or closed meeting or protected child presence"}
        '422': {description: "Person outside roster or missing correction reason"}
  /api/giving/reports:
    get:
      summary: Generate a donor statement or church/fund report
      description: Requires giving.manage. Inclusive period of up to 367 calendar days. Gifts and reversals use their respective dates. Returns entries, separate currency totals, fundTotals and a non-tax acknowledgement notice. Donor details include name and ID only.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: donorId, in: query, schema: {type: string, format: uuid}}
        - {name: fundId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Current-record report; no-store"}
        '403': {description: "Missing giving.manage"}
        '404': {description: "Unknown donor or fund"}
        '422': {description: "Invalid or excessively long date period"}
  /api/giving/reports/export:
    get:
      summary: Export the selected giving ledger to CSV
      description: Same filters and permission as the report. Includes signed integer minor units and exact currency decimal amounts. User-entered donor/fund names are escaped against spreadsheet formulas. This is an operational ledger export.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: donorId, in: query, schema: {type: string, format: uuid}}
        - {name: fundId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: UTF-8 CSV attachment; no-store
          content:
            text/csv:
              schema: {type: string}
        '403': {description: "Missing giving.manage"}
        '422': {description: "Invalid filters"}
  /api/giving/pledge-progress:
    get:
      summary: View explicit pledge contribution progress
      description: Uses active gift-to-pledge assignments and gift/reversal dates through asOf, with current pledge statuses. This is not a historical audit snapshot; it never automatically marks a pledge fulfilled.
      security: [{bearerAuth: []}]
      parameters:
        - {name: asOf, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: "Pledge applied/remaining amounts and overdue flags with assignment records; no-store"}
        '403': {description: "Missing giving.manage"}
        '422': {description: "Invalid date"}
  /api/giving/pledge-allocations:
    post:
      summary: Explicitly apply a posted gift to an open pledge
      description: Requires matching donor/currency and sufficient unassigned gift allocation in the pledge fund. Neither gift/fund nor pledge capacity may be exceeded. Reference makes retries idempotent. This does not change monetary ledger entries.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pledgeId, giftId, amountMinor, reference]
              properties:
                pledgeId: {type: string, format: uuid}
                giftId: {type: string, format: uuid}
                amountMinor: {type: integer, minimum: 1, maximum: 1000000000000}
                reference: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201': {description: "Audited assignment or identical previous reference"}
        '403': {description: "Missing giving.manage"}
        '404': {description: "Unknown pledge or gift"}
        '409': {description: "Incompatible or exhausted gift/pledge or reference conflict"}
        '422': {description: "Invalid amount or identity"}
  /api/giving/pledge-allocations/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Correct a pledge assignment while retaining history
      description: Requires giving.manage and a current expectedVersion. Frees the assignment's capacity without changing the gift ledger or reconciliation.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: "Cancelled assignment with reason and updated version"}
        '403': {description: "Missing giving.manage"}
        '404': {description: "Assignment not found"}
        '409': {description: "Stale or already cancelled assignment"}
        '422': {description: "Invalid correction"}
  /api/forms:
    get:
      summary: List reusable form definitions
      description: Requires forms.read. Supports limit (1–100) and after cursor; returns items and nextAfter. Definitions include public sharing tokens; responses require forms.manage.
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Paginated definitions"}
        '403': {description: "Missing forms.read"}
    post:
      summary: Create a draft form
      description: Requires forms.manage. An optional eventId/occurrenceId connects approvals to Events registration.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FormDefinitionInput'}
      responses:
        '201': {description: "Saved unpublished definition with publicToken and version"}
        '422': {description: "Invalid fields or target occurrence"}
  /api/forms/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a form definition
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Definition; requires forms.read"}
        '404': {description: "Form not found"}
    put:
      summary: Edit an unpublished form
      description: Requires forms.manage and expectedVersion. Submitted response snapshots stay unchanged.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/FormDefinitionInput'}
                - {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}
      responses:
        '200': {description: "Updated definition with new version"}
        '409': {description: "Published form or stale version"}
        '422': {description: "Invalid definition or missing expectedVersion"}
  /api/forms/{id}/publication:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Publish or unpublish a form
      description: Requires forms.manage. Unpublishing closes anonymous access without deleting responses.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [published, expectedVersion]
              properties:
                published: {type: boolean}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        '200': {description: "Updated publication and version"}
        '409': {description: "Stale version"}
  /api/forms/{id}/submissions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a form's privileged response queue
      description: Requires forms.manage. Returns items and nextAfter; each response preserves answers and its original form snapshot.
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "Paginated submissions"}
        '403': {description: "Missing forms.manage"}
  /api/forms/submissions/{id}/review:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Approve or reject a pending response
      description: Requires forms.manage. Linking requires people.read. Event approvals require events.manage and a personId; approval and registration commit together. No automatic person creation or matching occurs.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note, expectedVersion]
              properties:
                status: {type: string, enum: [approved, rejected]}
                note: {type: string, minLength: 1, maxLength: 1000}
                expectedVersion: {type: integer, minimum: 1}
                personId: {type: string, format: uuid, nullable: true}
      responses:
        '200': {description: "Final reviewed response with optional person and registration references"}
        '403': {description: "Missing review/link/booking permission"}
        '409': {description: "Stale or already reviewed response or event registration conflict"}
        '422': {description: "Invalid decision or unknown person"}
  /api/public/forms/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
    get:
      summary: Load a published anonymous form
      description: Returns title, description, fields, version, signed challenge, isEventRegistration and a nullable event overview (title, description, startsAt, endsAt, timezone, location and status). Event details are scoped to the linked occurrence. No stored responses, contact records, registration rosters or internal IDs are exposed. Responses are not cached.
      security: []
      responses:
        '200': {description: "Published schema with submission challenge"}
        '404': {description: "Unavailable or unpublished form"}
    post:
      summary: Submit a response for staff review
      description: Signed challenges require a two-second delay and expire after two hours. Ten attempts per client IP per fifteen minutes are allowed, including malformed attempts. submissionKey makes retries idempotent. This does not reserve an event place or create a person.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers, formVersion, submissionKey, challenge]
              properties:
                answers:
                  type: object
                  maxProperties: 20
                  additionalProperties:
                    oneOf: [{type: string, maxLength: 4000}, {type: boolean}]
                formVersion: {type: integer, minimum: 1}
                submissionKey: {type: string, format: uuid}
                challenge: {type: string, maxLength: 200}
                website: {type: string, default: '', description: Leave empty}
      responses:
        '202': {description: "Generic receipt acknowledgement without answers or record IDs"}
        '404': {description: "Form unavailable"}
        '409': {description: "Changed form revision or conflicting submission reference"}
        '422': {description: "Invalid answers or anti-spam challenge"}
        '429': {description: "Rate limit exceeded; Retry-After is 900 seconds"}
  /api/events/{eventId}/occurrences/{occurrenceId}/registrations:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: occurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: View a paginated attendee roster and registration policy
      description: Requires events.read. Returns settings, counts, remaining, acceptingRegistrations, items, and nextAfter. Attendees include personName and transition history, without contact details. Registration starts closed. Registration does not mark attendance.
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: "Registration overview and one roster page"}
        '422': {description: "Invalid filter or a stale roster cursor; reload the first page"}
        '403': {description: "Missing event read permission"}
        '404': {description: "Occurrence not found for this event"}
    post:
      summary: Register a known person for this occurrence
      description: Requires events.manage. Full occurrences use the waitlist when enabled. Active duplicates are rejected. Rejoining a cancelled registration retains history and joins the end of the queue.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: {type: string, format: uuid}
      responses:
        '201': {description: "Confirmed or waitlisted registration with current version"}
        '403': {description: "Missing event management permission"}
        '404': {description: "Occurrence not found for this event"}
        '409': {description: "Closed registration, duplicate attendee, or full occurrence without a waitlist"}
        '422': {description: "Invalid or unknown person"}
  /api/events/{eventId}/occurrences/{occurrenceId}/registrations/settings:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: occurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Configure registration availability, capacity and waitlist
      description: Requires events.manage. expectedVersion is mandatory and is 0 before the first configuration. Increased capacity promotes waiting attendees. Closing new entries preserves the existing queue. Cancelled and ended occurrences cannot be opened.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open, expectedVersion]
              properties:
                open: {type: boolean}
                capacity: {type: integer, nullable: true, minimum: 1, maximum: 1000}
                waitlistEnabled: {type: boolean, default: true}
                expectedVersion: {type: integer, minimum: 0}
      responses:
        '200': {description: "Updated settings with current version"}
        '403': {description: "Missing event management permission"}
        '404': {description: "Occurrence not found for this event"}
        '409': {description: "Stale version, insufficient capacity, or cancelled/ended occurrence"}
        '422': {description: "Invalid settings"}
  /api/events/{eventId}/occurrences/{occurrenceId}/registrations/{id}/cancel:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: occurrenceId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Cancel a registration with a reason
      description: Requires events.manage. Preserves history and promotes the next waiting person when the occurrence remains scheduled and has not ended.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedVersion]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        '200': {description: "Cancelled registration with current version"}
        '403': {description: "Missing event management permission"}
        '404': {description: "Occurrence or registration not found"}
        '409': {description: "Stale registration version"}
        '422': {description: "Invalid reason or version"}
  /health/ready:
    get:
      summary: Check database and baseline application readiness
      security: []
      responses:
        '200':
          description: Database and baseline schema/permissions are available
        '503':
          description: Application is not ready; database error details are withheld
  /api/people/search:
    get:
      summary: Search people for autocomplete
      description: Matches name, email, and phone terms in the database. Queries shorter than two characters return no suggestions. IDs mode resolves saved selections without a text query. Results have stable name/ID ordering; narrow the query when hasMore is true.
      security:
        - bearerAuth: []
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - name: excludeIds
          in: query
          description: Person IDs to omit. Encode as excludeIds[]=UUID.
          schema: {type: array, maxItems: 50, items: {type: string, format: uuid}}
        - name: ids
          in: query
          description: Resolve selected people by ID instead of searching text. Encode as ids[]=UUID.
          schema: {type: array, maxItems: 50, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Bounded suggestions or selected people
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  hasMore: {type: boolean}
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, firstName, lastName, dateOfBirth, email, phone]
                      properties:
                        id: {type: string, format: uuid}
                        firstName: {type: string}
                        lastName: {type: string}
                        dateOfBirth: {type: string, format: date, nullable: true}
                        email: {type: string, nullable: true}
                        phone: {type: string, nullable: true}
        '401': {description: "Authentication required"}
        '422': {description: "'Invalid query, limit, or IDs'"}
  /api/events:
    get:
      summary: List church events and their scheduled occurrences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Events ordered by title, with occurrences ordered by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChurchEvent' }
        '401': { description: Authentication required }
    post:
      summary: Create a church event with a finite schedule
      description: Local times use the event timezone. Weekly recurrence preserves the local hour. One-off events require occurrenceCount of 1; weekly schedules allow 1 to 52.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChurchEvent' }
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { description: Malformed request }
        '401': { description: Authentication required }
        '422': { description: Invalid event or schedule }

  /api/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a church event with its occurrences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Church event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurchEvent' }
        '401': { description: Authentication required }
        '404': { description: Event not found }
        '422': { description: Invalid event ID }
    put:
      summary: Edit event details without changing its schedule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchEventDetails' }
      responses:
        '204': { description: Details updated }
        '401': { description: Authentication required }
        '404': { description: Event not found }
        '422': { description: Invalid details }

  /api/events/{id}/occurrences/{occurrenceId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: occurrenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Reschedule, cancel, or restore one occurrence
      description: Times are local YYYY-MM-DDTHH:mm values in the parent event timezone. The occurrence ID is preserved. Other occurrences are unchanged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt, endsAt, location]
              properties:
                startsAt: { type: string, example: '2026-10-11T09:00' }
                endsAt: { type: string, example: '2026-10-11T11:00' }
                location: { type: string, minLength: 1, maxLength: 255 }
                status: { type: string, enum: [scheduled, cancelled], default: scheduled }
      responses:
        '204': { description: Occurrence updated }
        '401': { description: Authentication required }
        '404': { description: Event or occurrence not found }
        '422': { description: Invalid occurrence details }

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the application
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  application:
                    type: string
                    example: church-management-portal

  /api/users/{id}/member-access:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Link an existing account to a verified person and enable My church
      description: Requires identity.manage. Assigns a dedicated role containing only member.portal, preserves existing staff roles, and revokes sessions when access or the linked person changes. Inactive accounts are rejected. Identity must be verified by the administrator before submitting.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, expectedPersonId]
              properties:
                personId: {type: string, format: uuid}
                expectedPersonId: {type: string, format: uuid, nullable: true}
      responses:
        '200': {description: "id, personId and instruction to sign in again and enrol MFA"}
        '403': {description: "Account administration permission required"}
        '404': {description: "Account or person not found"}
        '409': {description: "Stale linked person, inactive account or conflicting member role"}
        '422': {description: "Invalid payload"}
  /api/reports/summary:
    get:
      summary: Source-scoped operational report
      description: Requires reports.read. Only permitted People, Attendance, Ministries and Giving sections appear. Dates cover attendance and giving; other counts are current. Children presence is deduplicated per occurrence/person; visitors remain separate. UTC dates and current corrections apply.
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: "from, to, permitted sections and notice; private no-store"}
        '403': {description: "Missing reports.read"}
        '422': {description: "Invalid period; maximum 367 days"}
  /api/reports/summary.csv:
    get:
      summary: Export permitted report sections as formula-safe CSV
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: "section, date, label, currency, value and unit; money remains in minor currency units"}
        '403': {description: "Missing reports.read"}
        '422': {description: "Invalid period"}
  /api/reports/segments:
    get:
      summary: List saved segments permitted by current source access
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "items with id, name, filters and version"}
        '403': {description: "Requires reports.read and people.read"}
    post:
      summary: Save an allow-listed People filter definition
      description: Requires reports.manage and each filter's source permissions. Attendance requires attendance.manage and ministry filters require ministries.manage. No arbitrary SQL or contact/sensitive-note filters.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportingSegmentPayload'}
      responses:
        '201': {description: "Saved segment and version"}
        '403': {description: "Missing report/source permissions"}
        '422': {description: "Invalid filter"}
  /api/reports/segments/preview:
    post:
      summary: Evaluate unsaved filters against current records
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filters]
              properties:
                filters: {$ref: '#/components/schemas/ReportingFilters'}
      responses:
        '200': {description: "items with id, name, status and age; count, evaluatedAt and notice"}
        '403': {description: "Missing report/source permissions"}
        '422': {description: "Invalid filter or future attendance dates"}
  /api/reports/segments/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Revise saved filters with optimistic concurrency
      description: Definition changes cause rules pinned to the old version to pause on their next evaluation.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportingSegmentPayload'}
      responses:
        '200': {description: "Updated segment"}
        '403': {description: "Missing report/source permissions"}
        '404': {description: "Segment not found"}
        '409': {description: "Stale segment version"}
        '422': {description: "Invalid filter"}
  /api/reports/segments/{id}/members:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Evaluate live segment membership
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "segment, items, count, evaluatedAt and notice"}
        '403': {description: "Missing report/source permissions"}
        '404': {description: "Segment not found"}
        '422': {description: "Invalid evaluation period"}
  /api/reports/segments/{id}/members.csv:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Export live segment membership with formula-safe names
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "CSV id, name, status, age; no contact details or support notes"}
        '403': {description: "Missing report/source permissions"}
        '404': {description: "Segment not found"}
  /api/reports/assignees:
    get:
      summary: Eligible active staff accounts for a task or segment
      description: Requires followups.manage and people.read. Segment scope also requires reports.read and its source access. Task scope requires task access. Supply at most one scope. Assignment does not grant permissions.
      security: [{bearerAuth: []}]
      parameters:
        - {name: segmentId, in: query, schema: {type: string, format: uuid}}
        - {name: taskId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "items with staff account id and username"}
        '403': {description: "Missing permission or source access"}
        '422': {description: "Invalid or conflicting scope"}
  /api/followups:
    get:
      summary: List assigned tasks, or source-permitted manager tasks
      description: Requires followups.work; followups.manage grants it. Every task retains source permissions. Non-managers see only their own tasks.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "items with task fields, personName, assigneeName, overdue and outcome history"}
        '403': {description: "Missing permission or active account"}
    post:
      summary: Explicitly assign a follow-up to eligible staff
      description: Requires followups.manage and source access. With segmentId, the person must still match that live segment. No communication is created.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportingTaskPayload'}
      responses:
        '201': {description: "Assigned task"}
        '403': {description: "Missing permission or source access"}
        '404': {description: "Person or segment unavailable"}
        '409': {description: "Person no longer matches or assignee is ineligible"}
        '422': {description: "Invalid task"}
  /api/followups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a task with current assignment and source checks
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Task with outcome history"}
        '403': {description: "Not assigned, not a manager or source permission revoked"}
        '404': {description: "Task not found"}
  /api/followups/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record progress, completion, cancellation or reopening
      description: Requires current task access. An outcome is required for completion/cancellation and when reopening a closed task.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, status]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                status: {type: string, enum: [open, in_progress, completed, cancelled]}
                note: {type: string, maxLength: 1000, default: ''}
      responses:
        '200': {description: "Updated task with actor/time/outcome history"}
        '403': {description: "Task/source access denied"}
        '409': {description: "Stale version or invalid transition"}
        '422': {description: "Invalid or missing outcome"}
  /api/followups/{id}/assignment:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Manager reassignment with reason and due-date correction
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, assigneeId, dueOn, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                assigneeId: {type: string, format: uuid}
                dueOn: {type: string, format: date}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: "Reassigned task and history"}
        '403': {description: "Missing followups.manage or source access"}
        '409': {description: "Stale task or ineligible assignee"}
        '422': {description: "Invalid reassignment"}
  /api/reports/rules:
    get:
      summary: Source-permitted automation rules and review reasons
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "items with active state, pinned segment version, owner, assignee, lastRunAt and reviewReason"}
        '403': {description: "Requires reports.read and followups.manage"}
    post:
      summary: Create an opt-in rule owned by the current manager
      description: Requires reports.manage, followups.manage and source access. Disabled by default. At most one task per person and rule, even after completion; never sends communications.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportingRulePayload'}
      responses:
        '201': {description: "Saved rule; daily worker evaluates enabled rules"}
        '403': {description: "Missing rule/source permissions"}
        '409': {description: "Stale segment or ineligible assignee"}
        '422': {description: "Invalid rule"}
  /api/reports/rules/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: Review/update a rule and explicitly reactivate if appropriate
      description: Current manager becomes owner. Must review the latest segment version and choose eligible staff. expectedVersion is required.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportingRulePayload'}
      responses:
        '200': {description: "Updated reviewed rule"}
        '403': {description: "Missing rule/source permissions"}
        '409': {description: "Stale rule/segment or ineligible assignee"}
        '422': {description: "Invalid rule"}
  /api/reports/rules/{id}/run:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Explicit immediate evaluation of an enabled rule
      description: Requires reports.manage, followups.manage and source access. Rechecks stored owner/assignee access and pinned segment version under the shared workflow transaction. More than 1000 matches pauses the rule.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "created, paused and message; retries cannot duplicate tasks"}
        '403': {description: "Missing rule/source permissions"}
        '404': {description: "Rule not found"}
  /api/account-security:
    get:
      summary: Read own authenticator status without revealing secrets
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "enabled, verified and remainingRecoveryCodes; private no-store"}
        '401': {description: "Authentication required"}
  /api/account-security/{action}:
    parameters:
      - {name: action, in: path, required: true, schema: {type: string, enum: [setup, enable, verify, recovery-codes, password]}}
    post:
      summary: Manage own authenticator, recovery codes and password
      description: Setup needs current password; enable needs password and pending authenticator code. Verify needs a fresh code. Recovery-code replacement requires a verified session and password. Password change requires the current password and a verified session if MFA is enabled. Setup expires in ten minutes; replayed codes fail. Rate limited to five operations per account per minute.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, format: password, maxLength: 4096}
                code: {type: string, maxLength: 64}
                newPassword: {type: string, format: password, maxLength: 4096}
      responses:
        '200': {description: "Setup returns secret and uri once; enable/recovery-codes return eight recovery codes and a renewed verified token; verify returns a verified token; password change returns a message and revokes all sessions"}
        '403': {description: "Verified authenticator session required"}
        '409': {description: "Wrong password, invalid/replayed code or expired setup"}
        '422': {description: "Invalid payload or password length"}
        '429': {description: "Attempt limit reached"}
  /api/account-recovery:
    post:
      summary: Recover an active account with a one-time offline code
      description: Public, rate limited independently by IP and normalised username to five attempts per fifteen minutes. Successful recovery resets the password, clears old MFA and all codes, and revokes all sessions. Fresh authenticator enrolment is required for member access. Administrator-issued codes expire after thirty minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code, newPassword]
              properties:
                username: {type: string, minLength: 1, maxLength: 255}
                code: {type: string, minLength: 1, maxLength: 64}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 4096}
      responses:
        '200': {description: "Recovered; sign in with new password and enrol MFA again"}
        '409': {description: "Generic invalid, expired, consumed or unavailable recovery details"}
        '422': {description: "Invalid payload"}
        '429': {description: "Attempt limit reached"}
  /api/member:
    get:
      summary: Own linked profile, household membership summaries and bookings
      description: Requires explicit member.portal, active linked identity, enabled MFA and a verified token. Caller-supplied person IDs cannot alter scope. Household summaries expose only name, own role and member count. Bookings are the latest 100, with no attendee roster or staff history.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "profile with revision, families and registrations; private no-store"}
        '403': {description: "Missing permission, linked identity or authenticator verification"}
        '404': {description: "Linked person unavailable"}
  /api/member/contact:
    put:
      summary: Update only own email and phone
      description: Does not change identity fields, household membership, login username or communication consent.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, expectedRevision]
              properties:
                email: {type: string, format: email, maxLength: 254, nullable: true}
                phone: {type: string, maxLength: 40, nullable: true}
                expectedRevision: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: "Updated own profile and revision"}
        '403': {description: "Missing member access or MFA"}
        '409': {description: "Concurrent profile change; reload required"}
        '422': {description: "Invalid contact details"}
  /api/member/registrations/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
