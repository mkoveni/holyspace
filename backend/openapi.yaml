  /api/children-station:
    get:
      summary: List sessions assigned to the linked supervising operator
      description: Requires children.station, an active linked account, and current session staffing scope. No People permission needed. All station responses use private, no-store caching.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Assigned session items with class and occurrence"}
        '403': {description: "Missing station permission or active linked identity"}
  /api/children-station/sessions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a scoped enrolled roster and open custody
      description: Includes child names, open check-ins and currently authorised collector names. Excludes contact details, birth dates, support notes and pickup codes.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Session, className, occurrence and items"}
        '403': {description: "Operator is not assigned to this session"}
        '404': {description: "Session not found"}
  /api/children-station/sessions/{id}/arrivals:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Receive a child and atomically issue paired labels
      description: Operator is inferred from the linked account. Enrolment, age, staffing, capacity, arrival window and duplicate custody rules apply.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId]
              properties:
                childId: {type: string, format: uuid}
      responses:
        '201': {description: "checkInId, childName, className, occurrence, code and labelVersion for paired printing"}
        '403': {description: "Outside supervising scope"}
        '409': {description: "Arrival rules or capacity prevent check-in"}
        '422': {description: "Invalid child"}
  /api/children-station/checkins/{id}/label:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read current label version without disclosing code
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "version, or zero if no label has been issued"}
        '403': {description: "Outside supervising scope"}
    post:
      summary: Audited label issue, reprint or lost-label replacement
      description: An empty replacementReason preserves the code. A non-empty reason rotates it and invalidates old copies. Collected children cannot receive labels.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                replacementReason: {type: string, maxLength: 500, default: ''}
      responses:
        '200': {description: "Paired printable label data and current labelVersion"}
        '403': {description: "Outside supervising scope"}
        '409': {description: "Stale label or child already collected"}
        '422': {description: "Invalid version or reason"}
  /api/children-station/checkins/{id}/collect:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Verify identity, pickup code and current authority before handover
      description: Requires current check-in expectedVersion, a matching current code, identityVerified=true and an active unexpired pickup authorisation. Operator is inferred from the account. Supervisors can collect existing custody after cancellation.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collectorId, pickupCode, expectedVersion, identityVerified]
              properties:
                collectorId: {type: string, format: uuid}
                pickupCode: {type: string, minLength: 1, maxLength: 20}
                expectedVersion: {type: integer, minimum: 1}
                identityVerified: {type: boolean}
      responses:
        '200': {description: "Collected check-in with verified identity and pickupLabelVersion"}
        '403': {description: "Outside supervising scope"}
