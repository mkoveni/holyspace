# Installed by deploy/setup-server.sh as /etc/nginx/sites-available/onechurch-web.
# The web app (static files) and the Symfony API on one origin: /api/* and /health/ready go straight to the API's
# PHP-FPM pool, so the browser never needs CORS and relative /api URLs in the app keep working.
# Needs the API set up first (backend-symfony/deploy/setup-server.sh): it installs the fastcgi snippet and the pool.

# Paths can carry public form tokens (/forms/public/<token>) and API capabilities: never log them.
log_format onechurch_web_private '$time_iso8601 $request_id $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name holyspace.rivalani.dev;
    server_tokens off;
    access_log /var/log/nginx/onechurch-web.access.log onechurch_web_private;
    error_log /var/log/nginx/onechurch-web.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://holyspace.rivalani.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name holyspace.rivalani.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/holyspace.rivalani.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holyspace.rivalani.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:onechurch_web_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/onechurch-web.access.log onechurch_web_private;
    error_log /var/log/nginx/onechurch-web.error.log warn;

    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf font/otf;

    # `current` is switched atomically by each deploy; nginx resolves the symlink on every request.
    root /srv/onechurch-web/current;
    index index.html;

    # Headers are set per location: an add_header inside a location replaces every server-level one.

    # ---- Symfony API on the same origin ----
    # The application sets nosniff, X-Frame-Options, cache and HSTS headers on /api itself.
    location /api/ {
        add_header Referrer-Policy no-referrer always;
        root /srv/onechurch-api/current/public;
        include /etc/nginx/snippets/onechurch-api-fastcgi.conf;
    }
    location = /health/ready {
        root /srv/onechurch-api/current/public;
        include /etc/nginx/snippets/onechurch-api-fastcgi.conf;
        fastcgi_param REQUEST_URI /actuator/health;
    }

    # ---- Web app ----
    # Content-hashed build output: cache for a year. Old releases' chunks are carried into each new release so open
    # tabs can still lazy-load the pages they were built with.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    # The build's own marker file; never exposed.
    location = /.release-assets {
        return 404;
    }
    location / {
        # Client-side routes (/people/42, /forms/public/<token>) all fall back to the app shell.
        try_files $uri $uri/ /index.html;
        # index.html names the current hashed bundles: always revalidate it.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
