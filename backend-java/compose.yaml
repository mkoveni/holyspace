name: onechurch-java

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: onechurch_java
      POSTGRES_USER: onechurch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-development-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onechurch -d onechurch_java"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/onechurch_java
      DB_USERNAME: onechurch
      DB_PASSWORD: ${DB_PASSWORD:-development-only}
      SERVER_PORT: 8082
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_CAPTURE: ${EMAIL_CAPTURE:-true}
      EMAIL_FROM: ${EMAIL_FROM:-ministry@onechurch.test}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PAYMENTS_PUBLIC_URL: ${PAYMENTS_PUBLIC_URL:-}
      PAYMENTS_BACKEND_URL: ${PAYMENTS_BACKEND_URL:-${PAYMENTS_PUBLIC_URL:-}}
      PAYFAST_MODE: ${PAYFAST_MODE:-test}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_ITN_IP_RANGES: ${PAYFAST_ITN_IP_RANGES:-197.97.145.144/28,41.74.179.192/27}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_POLL_MS: ${PUSH_POLL_MS:-15000}
      PUSH_PROJECT_ID: ${PUSH_PROJECT_ID:-}
      PUSH_TOKEN_KEY: ${PUSH_TOKEN_KEY:-}
      PUSH_ACCESS_TOKEN: ${PUSH_ACCESS_TOKEN:-}
      PAYMENTS_TOKEN_KEY: ${PAYMENTS_TOKEN_KEY:-}
      YOCO_MODE: ${YOCO_MODE:-test}
      YOCO_SECRET_KEY: ${YOCO_SECRET_KEY:-}
      YOCO_WEBHOOK_SECRET: ${YOCO_WEBHOOK_SECRET:-}
      PEOPLE_TIME_ZONE: ${PEOPLE_TIME_ZONE:-Africa/Johannesburg}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
