services:
  database:
    image: postgres:18
    container_name: church-db
    environment:
      POSTGRES_DB: church_portal
      POSTGRES_USER: church
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U church -d church_portal']
      interval: 5s
      timeout: 5s
      retries: 20
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  php:
    image: ${COMPOSE_PROJECT_NAME:-onechurch}-php
    environment: &postgres-environment
      DATABASE_URL: postgresql://church:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-development-only}}@database:5432/church_portal?serverVersion=18
      MIGRATIONS_PATH: migrations-postgresql
      LOCK_DSN: postgresql+advisory://church:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-development-only}}@database:5432/church_portal
      YOCO_SECRET_KEY: sk_test_1c1046a9VBQ21RQ637d4a0b99374
      YOCO_WEBHOOK_SECRET: whsec_d1f88d09gOePbJe7cbc4
      YOCO_MODE: test
      PAYMENTS_PUBLIC_URL: https://rivalani.dev/api/payments/webhooks/yoco
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: church-php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  followups:
    image: ${COMPOSE_PROJECT_NAME:-onechurch}-php
    restart: unless-stopped
    working_dir: /var/www/html
    command: [sh, /usr/local/bin/church-worker, followups]
    environment: *postgres-environment
    volumes:
      - ./backend:/var/www/html
      - ./docker/production/worker.sh:/usr/local/bin/church-worker:ro
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/tmp/church-worker-heartbeat') && time()-filemtime('/tmp/church-worker-heartbeat')<60?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  payments:
    image: ${COMPOSE_PROJECT_NAME:-onechurch}-php
    restart: unless-stopped
    working_dir: /var/www/html
    command: [sh, /usr/local/bin/church-worker, payments]
    environment: *postgres-environment
    volumes:
      - ./backend:/var/www/html
      - ./docker/production/worker.sh:/usr/local/bin/church-worker:ro
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/tmp/church-worker-heartbeat') && time()-filemtime('/tmp/church-worker-heartbeat')<60?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  webserver:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: churchwebserver
    ports:
      - 8081:80
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: holyspace-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    # Java API contract served by the Symfony port. Start backend-symfony first (make up there):
    # this joins its network and proxies /api to its app container.
    command: [npx, vite, --host, 0.0.0.0, --port, '5173']
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: /
      VITE_API_PROXY_TARGET: http://onechurch-symfony-app-1:8083
    networks: [default, symfony]
networks:
  symfony:
    name: onechurch-symfony_default
    external: true
volumes:
  pgadmin_data:
  postgres_data:
  frontend_node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./frontend/node_modules
