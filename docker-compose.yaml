services:
  database:
    image: mysql:8.0
    container_name: church-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: church_portal
      MYSQL_USER: rivalani
      MYSQL_PASSWORD: churchportal
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_admin
    restart: always
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "8082:80"
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: church-php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: churchwebserver
    ports:
      - 8000:80
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php

volumes:
  db_data:
