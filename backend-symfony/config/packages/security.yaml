security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            stateless: true
            lazy: true
            provider: users_in_memory
            entry_point: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses
            access_denied_handler: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses
            access_token:
                token_handler: App\IdentityAccess\Infrastructure\Security\SessionAccessTokenHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    # Mirrors the Java filter chain: public health and login, authenticated API, everything else denied.
    access_control:
        - { path: ^/actuator/health, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, methods: [POST, OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        # Payments' explicit trusted entry points: authenticated provider callbacks and the one-use mobile checkout token.
        - { path: ^/api/payments/webhooks/[a-z]+$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/mobile-checkouts/[^/]+$, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # Event and community cover images by random id (Media LegacyCoverRedirectController, redirects to /api/public/media/{id}): pictures only, no personal data.
        - { path: ^/api/public/cover-images/[^/]+$, methods: [GET], roles: PUBLIC_ACCESS }
        # Event and community pictures from the Media context by random file id: public kinds only, the handler answers 404 for the rest.
        - { path: ^/api/public/media/[^/]+(/[^/]+)?$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        # Visitor self check-in: the QR link token is the credential; the handler answers 404 for a bad, off or rotated link.
        - { path: ^/api/public/visits/[^/]+$, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # Public giving: no account or person record. Starting a checkout is guarded by a captcha, per-address and per-email
        # throttles; the outcome is read only with the order's own access token (sent in the body, never a URL).
        - { path: ^/api/public/giving$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/public/giving/(checkouts|orders/status)$, methods: [POST], roles: PUBLIC_ACCESS }
        # Public paid events: browsing is open; ordering is guarded by a captcha and throttles; an order's outcome and its tickets
        # are read only with the buyer's own access or wallet token, sent in the body (never a URL).
        - { path: ^/api/public/events$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/public/events/[0-9a-fA-F-]{36}$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/public/events/[0-9a-fA-F-]{36}/orders$', methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/public/ticket-orders/(status|wallet|resend)$, methods: [POST], roles: PUBLIC_ACCESS }
        # Public forms and quizzes: the link token is the credential; submits are guarded by a captcha and throttles.
        - { path: ^/api/public/forms/[A-Za-z0-9_-]+(/leaderboard)?$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/public/forms/[A-Za-z0-9_-]+$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: ROLE_NEVER_GRANTED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
