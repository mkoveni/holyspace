security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            stateless: true
            lazy: true
            provider: users_in_memory
            entry_point: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses
            access_denied_handler: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses
            access_token:
                token_handler: App\IdentityAccess\Infrastructure\Security\SessionAccessTokenHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\JsonSecurityResponses

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    # Mirrors the Java filter chain: public health and login, authenticated API, everything else denied.
    access_control:
        - { path: ^/actuator/health, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, methods: [POST, OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        # Payments' explicit trusted entry points: authenticated provider callbacks and the one-use mobile checkout token.
        - { path: ^/api/payments/webhooks/[a-z]+$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/mobile-checkouts/[^/]+$, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # Event and community cover images by random id (CoverImageController): pictures only, no personal data.
        - { path: ^/api/public/cover-images/[^/]+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: ROLE_NEVER_GRANTED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
