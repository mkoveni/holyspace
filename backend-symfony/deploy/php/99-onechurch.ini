; Install as /etc/php/PHP_VERSION/fpm/conf.d/99-onechurch.ini and .../cli/conf.d/99-onechurch.ini.
; Production PHP settings for the Symfony API (https://symfony.com/doc/current/performance.html).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.assertions = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes in place: each deploy is a new release directory and reloads php-fpm, which resets OPcache.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
date.timezone = UTC
