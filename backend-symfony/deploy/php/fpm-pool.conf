; Install as /etc/php/PHP_VERSION/fpm/pool.d/onechurch-api.conf (setup-server.sh does this).
; A dedicated pool: runs as the onechurch user, listens only on a unix socket nginx can reach.
[onechurch-api]
user = onechurch
group = onechurch

listen = /run/php/onechurch-api.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for a small VPS (about 60 MB per worker). Raise pm.max_children with available memory.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000

request_terminate_timeout = 65s
request_slowlog_timeout = 10s
slowlog = /var/log/onechurch-api/fpm-slow.log

; Monolog writes JSON to stderr in prod; keep it, undecorated, in the pool log.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /var/log/onechurch-api/php-error.log
php_admin_flag[log_errors] = on

; Only the variables Symfony needs reach PHP; configuration comes from .env.local.php.
clear_env = yes

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 6M
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
