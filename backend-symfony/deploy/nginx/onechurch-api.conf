log_format onechurch_api_private '$time_iso8601 $request_id $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name holyspace-api.rivalani.dev;
    server_tokens off;
    access_log /var/log/nginx/onechurch-api.access.log onechurch_api_private;
    error_log /var/log/nginx/onechurch-api.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://holyspace-api.rivalani.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name holyspace-api.rivalani.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/holyspace-api.rivalani.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holyspace-api.rivalani.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:onechurch_api_ssl:10m;
    ssl_session_timeout 1d;

    # URLs can carry one-use payment capabilities (/api/mobile-checkouts/{token}): never log paths or queries.
    access_log /var/log/nginx/onechurch-api.access.log onechurch_api_private;
    error_log /var/log/nginx/onechurch-api.error.log warn;

    client_max_body_size 6m;
    # The application sets nosniff, X-Frame-Options, cache and HSTS headers on /api itself.
    add_header Referrer-Policy no-referrer always;

    # Nothing is served from disk: the API is index.php only.
    root /srv/onechurch-api/current/public;

    location /api/ {
        include /etc/nginx/snippets/onechurch-api-fastcgi.conf;
    }
    location = /health/ready {
        include /etc/nginx/snippets/onechurch-api-fastcgi.conf;
        fastcgi_param REQUEST_URI /actuator/health;
    }
    location / {
        return 404;
    }
}
