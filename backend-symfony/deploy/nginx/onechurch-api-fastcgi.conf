# Install as /etc/nginx/snippets/onechurch-api-fastcgi.conf. Every request goes to the Symfony front controller.
include fastcgi_params;

# $realpath_root resolves the `current` symlink, so a deploy switch takes effect atomically per request.
fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
fastcgi_param DOCUMENT_ROOT $realpath_root;
fastcgi_param SCRIPT_NAME /index.php;

# Pin the host and drop client-supplied forwarding headers (Symfony trusts no proxy; this keeps it that way).
fastcgi_param HTTP_HOST $server_name;
fastcgi_param SERVER_NAME $server_name;
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PROTO "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_X_FORWARDED_PREFIX "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_PROXY "";
fastcgi_param HTTP_X_REQUEST_ID $request_id;

fastcgi_pass unix:/run/php/onechurch-api.sock;
fastcgi_connect_timeout 5s;
fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
