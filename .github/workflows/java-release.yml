name: Java and member app release checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: java-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - run: ./mvnw -B -ntp clean verify
        working-directory: backend-java
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: java-test-results
          path: backend-java/target/surefire-reports/*.xml
          retention-days: 7
      - run: scripts/java-production/verify.sh
      - run: python3 scripts/java-production/verify-nginx.py
      - run: scripts/java-production/security-scan.sh release-check /tmp/holyspace-image-security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security
          path: /tmp/holyspace-image-security/*.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-check-log
          path: |
            /tmp/holyspace-java-verify.log
            frontend/test-results/
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:java
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo export --platform all --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://api.release-check.example
          EXPO_NO_TELEMETRY: '1'
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile browser workflows
        run: |
          CI=1 EXPO_NO_TELEMETRY=1 npm run web > /tmp/member-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081 >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: member-browser-failures
          path: mobile/test-results/
          retention-days: 7
  mobile-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Block high/critical findings without silently waiving upstream dependencies.
      - run: npm audit --audit-level=high
