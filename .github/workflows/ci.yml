name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_TEST_URL: postgresql://postgres:integration-only@127.0.0.1:5432/church?serverVersion=18
      MYSQL_TEST_URL: mysql://root:integration-only@127.0.0.1:3306/church?serverVersion=8.0
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: church
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d church" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: church
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost -pintegration-only" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: docker build --target test -t holyspace-tests -f docker/production/php.Dockerfile .
      - run: docker run --rm --network host -e APP_ENV=dev -e DATABASE_URL="$POSTGRES_TEST_URL" -e MIGRATIONS_PATH=migrations-postgresql holyspace-tests php bin/console doctrine:migrations:migrate --no-interaction
      - run: docker run --rm --network host -e POSTGRES_TEST_URL -e MYSQL_TEST_URL holyspace-tests php vendor/bin/phpunit
      - run: docker run --rm holyspace-tests composer architecture:check
      - run: docker run --rm holyspace-tests composer cs:check
      - run: docker run --rm holyspace-tests composer audit --locked
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:components
        working-directory: frontend
      - run: BROWSER_RUNNER=host scripts/production/verify.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7
