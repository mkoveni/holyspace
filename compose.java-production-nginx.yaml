# Use through JAVA_PRODUCTION_TARGET=nginx-api and the production scripts.
# Only host Nginx can reach this loopback listener; never bind it to 0.0.0.0.
services:
  api:
    ports: ['127.0.0.1:18082:8082']
  web:
    profiles: [bundled-edge]
  edge:
    profiles: [bundled-edge]
    ports: !reset []
