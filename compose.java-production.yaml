name: holyspace-java-prod

x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '5'}
x-api-environment: &api-environment
  SPRING_PROFILES_ACTIVE: production
  DB_URL: jdbc:postgresql://database:5432/holyspace
  DB_USERNAME: holyspace_runtime
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  SERVER_PORT: 8082
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set exact HTTPS frontend origins}
  PEOPLE_TIME_ZONE: ${PEOPLE_TIME_ZONE:-Africa/Johannesburg}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-8h}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  EMAIL_CAPTURE: 'false'
  EMAIL_FROM: ${EMAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_AUTH: ${SMTP_AUTH:-true}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  PAYMENTS_PUBLIC_URL: ${PAYMENTS_PUBLIC_URL:?Set HTTPS frontend origin}
  PAYMENTS_BACKEND_URL: ${PAYMENTS_BACKEND_URL:?Set HTTPS backend origin}
  PUSH_ENABLED: ${PUSH_ENABLED:-false}
  PUSH_PROJECT_ID: ${PUSH_PROJECT_ID:-}

services:
  database:
    image: holyspace-java-database:${RELEASE_TAG:?Set an immutable release tag}
    build: {context: ., dockerfile: docker/java-production/database.Dockerfile}
    restart: unless-stopped
    environment:
      POSTGRES_DB: holyspace
      POSTGRES_USER: holyspace_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, runtime_password, migration_password]
    volumes:
      - database:/var/lib/postgresql
      - ./docker/java-production/init-database.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD, holyspace-database-ready]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    profiles: [operations]
    image: holyspace-java-api:${RELEASE_TAG:?Set an immutable release tag}
    build: ./backend-java
    command: [migrate]
    environment:
      DB_URL: jdbc:postgresql://database:5432/holyspace
      DB_USERNAME: holyspace_migrator
      DB_PASSWORD_FILE: /run/secrets/migration_password
    secrets: [migration_password]
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      database: {condition: service_healthy}
    logging: *logging

  api:
    image: holyspace-java-api:${RELEASE_TAG:?Set an immutable release tag}
    build: ./backend-java
    restart: unless-stopped
    environment: *api-environment
    secrets:
      - {source: runtime_password, target: DB_PASSWORD}
      - {source: payments_key, target: PAYMENTS_TOKEN_KEY}
      - {source: push_key, target: PUSH_TOKEN_KEY}
      - {source: smtp_password, target: SMTP_PASSWORD}
      - {source: push_access_token, target: PUSH_ACCESS_TOKEN}
    networks: [database, application]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    stop_grace_period: 45s
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8082/actuator/health/readiness']
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 90s
    logging: *logging

  web:
    image: holyspace-java-web:${RELEASE_TAG:?Set an immutable release tag}
    build: {context: ., dockerfile: docker/java-production/web.Dockerfile}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:8080/health/ready']
      interval: 30s
      timeout: 7s
      retries: 3
    logging: *logging

  edge:
    image: holyspace-java-edge:${RELEASE_TAG:?Set an immutable release tag}
    build: {context: ., dockerfile: docker/java-production/edge.Dockerfile}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      CHURCH_DOMAIN: ${CHURCH_DOMAIN:?Set frontend domain}
      API_DOMAIN: ${API_DOMAIN:?Set separate API domain}
    volumes:
      - ./docker/java-production/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [application]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  tools:
    profiles: [operations]
    image: holyspace-java-tools:${RELEASE_TAG:?Set an immutable release tag}
    build: {context: ., dockerfile: docker/java-production/tools.Dockerfile}
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  database: {internal: true}
  application:
volumes:
  database:
  certificates:
  caddy_config:
secrets:
  admin_password: {file: '${SECRETS_DIR:?Set private secrets directory}/admin_password'}
  runtime_password: {file: '${SECRETS_DIR}/runtime_password'}
  migration_password: {file: '${SECRETS_DIR}/migration_password'}
  payments_key: {file: '${SECRETS_DIR}/payments_key'}
  push_key: {file: '${SECRETS_DIR}/push_key'}
  smtp_password: {file: '${SECRETS_DIR}/smtp_password'}
  push_access_token: {file: '${SECRETS_DIR}/push_access_token'}
