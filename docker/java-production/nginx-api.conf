# Install as /etc/nginx/sites-available/holyspace-api after replacing the domain
# and obtaining its certificate. This file is included within nginx's http block.
log_format holyspace_api_private '$request_id $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name api.church.example.org;
    server_tokens off;
    access_log /var/log/nginx/holyspace-api.access.log holyspace_api_private;
    error_log /var/log/nginx/holyspace-api.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://api.church.example.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.church.example.org;
    ssl_certificate /etc/letsencrypt/live/api.church.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.church.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    # URLs can contain one-use payment capabilities. Do not log paths or queries.
    access_log /var/log/nginx/holyspace-api.access.log holyspace_api_private;
    error_log /var/log/nginx/holyspace-api.error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $server_name;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Proto $scheme;
    # This configuration assumes Nginx is the public edge, without another proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://127.0.0.1:18082;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:18082/actuator/health/readiness;
    }
    location / {
        return 404;
    }
}
