# Installed by the VPS setup script inside Nginx's http block.
log_format holyspace_frontend_private '$request_id $request_method $status $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name church.example.org;
    server_tokens off;
    access_log /var/log/nginx/holyspace-frontend.access.log holyspace_frontend_private;
    error_log /var/log/nginx/holyspace-frontend.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://church.example.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name church.example.org;
    ssl_certificate /etc/letsencrypt/live/church.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/church.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    access_log /var/log/nginx/holyspace-frontend.access.log holyspace_frontend_private;
    error_log /var/log/nginx/holyspace-frontend.error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
